name: Hoppity
options:
  bundleIdPrefix: in.hoppity
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Hoppity:
    type: application
    platform: iOS
    sources:
      - path: Hoppity
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_NAME: Hoppity
        PRODUCT_BUNDLE_IDENTIFIER: in.hoppity.app   # <-- CHANGE to your registered App ID
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Hoppity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"                 # 1 = iPhone only
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                        # <-- PUT your 10-char Apple Team ID here
